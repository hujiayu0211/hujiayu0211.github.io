<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found · Jasper (Jiayu Hu)</title>
<link rel="icon" type="image/png" href="/assets/logo/UNSW-logo-transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EDE3;--panel:#FFFFFF;--panel-2:#F4F0E6;--text:#1C1E18;--text-soft:#55584E;--text-faint:#8A8C80;
  --leaf:#2F5D43;--leaf-dim:#4E7A5E;--leaf-deep:#234A35;--line:rgba(28,30,24,.13);
  --serif:'Newsreader',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:inherit;text-decoration:none}
::selection{background:var(--leaf);color:var(--bg)}
nav{border-bottom:1px solid var(--line);background:rgba(241,237,227,.9)}
.nav-inner{max-width:1320px;margin:0 auto;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand-logo,.nav-links{font-size:13.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nav-links{display:flex;gap:18px}
.brand-logo:hover,.nav-links a:hover{opacity:.68}
main{flex:1;display:flex;align-items:center}
.wrap{max-width:1320px;width:100%;margin:0 auto;padding:72px 28px 96px}
.eyebrow{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--leaf);margin-bottom:26px}
.eyebrow .ln{width:42px;height:1px;background:var(--leaf-dim)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,7vw,5.2rem);line-height:1.02;letter-spacing:-.025em;max-width:880px}
h1 em{font-style:italic;color:var(--leaf)}
.sub{margin-top:26px;max-width:620px;color:var(--text-soft);font-size:17px}
.path{display:inline-block;margin-top:22px;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);font-family:var(--mono);font-size:13px;color:var(--text-soft);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;transition:background .2s,border-color .2s,color .2s}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.btn.primary:hover{background:var(--leaf-deep)}
.btn:not(.primary):hover{border-color:var(--leaf);color:var(--leaf)}
footer{border-top:1px solid var(--line);padding:18px 28px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--text-faint);letter-spacing:.06em}
:focus-visible{outline:2px solid var(--leaf);outline-offset:3px}
@media (max-width:560px){
  .nav-inner,.wrap{padding-left:18px;padding-right:18px}
  .nav-links a:not(:first-child){display:none}
  .wrap{padding-top:48px;padding-bottom:64px}
  .sub{font-size:16px}
}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="brand-logo" aria-label="JASPER H. Home">JASPER H.</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/news">News</a>
      <a href="/publications">Publications</a>
      <a href="/projects">Projects</a>
    </div>
  </div>
</nav>
<main>
  <div class="wrap">
    <div class="eyebrow"><span class="ln"></span>Error 404 · Page not found</div>
    <h1>This page <em>doesn't exist</em>.</h1>
    <p class="sub">The link may be out of date, or the address may contain a typo. The home page and the project list are good places to start.</p>
    <code class="path" id="missingPath">/</code>
    <div class="actions">
      <a class="btn primary" href="/">Back to home →</a>
      <a class="btn" href="/projects">See projects</a>
    </div>
  </div>
</main>
<footer>© Jasper (Jiayu Hu)</footer>
<script>
  var p = location.pathname;
  try { p = decodeURI(p); } catch (e) {}
  document.getElementById('missingPath').textContent = p;
</script>
</body>
</html>
